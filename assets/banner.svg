<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">TokenWarden — 词元卫士</title>
  <desc id="desc">A context and cost guard for long-running AI coding agents. 面向长会话 AI 编程代理的上下文与成本守卫。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="0.58" stop-color="#172536"/>
      <stop offset="1" stop-color="#0d2423"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#61e4b3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d9fff3" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1095" cy="92" r="104" fill="none" stroke="url(#accent)" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="1095" cy="92" r="72" fill="none" stroke="url(#accent)" stroke-opacity=".48" stroke-width="3"/>
  <path d="M1042 93h28l16-31 25 62 18-31h25" fill="none" stroke="#61e4b3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="74" y="125" fill="#f6f8fb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" letter-spacing="-2">TokenWarden</text>
  <text x="77" y="169" fill="#9fb2c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">词元卫士</text>
  <rect x="74" y="202" width="72" height="6" rx="3" fill="url(#accent)"/>
  <text x="74" y="248" fill="#dfe9f4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27">Keep task facts. Drop replay waste. Break fix loops.</text>
  <text x="74" y="283" fill="#dfe9f4" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="23">保留任务事实，丢掉回放浪费，打断重复修复。</text>
  <text x="74" y="321" fill="#7f96ab" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">LOCAL-FIRST · DETERMINISTIC · NO TELEMETRY</text>
  <text x="563" y="321" fill="#7f96ab" font-family="ui-monospace, SFMono-Regular, Menlo, PingFang SC, monospace" font-size="18">本地优先 · 确定性 · 无遥测</text>
</svg>
