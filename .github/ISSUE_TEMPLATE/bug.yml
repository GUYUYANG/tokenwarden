name: Bug report
description: Report a reproducible problem with redacted evidence.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not paste a full transcript, credentials, private paths, or customer data."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a synthetic fixture or redacted structured output.
    validations:
      required: true
